spring:
  application:
    name: FldcProcessApplication
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:annapurna_consolidated}?currentSchema=${DB_SCHEMA:dbt_apy}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ${DB_SCHEMA:dbt_apy}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:dbt_apy},cross_check
  session:
    jdbc:
      initialize-schema: ${SPRING_SESSION_JDBC_INITIALIZE_SCHEMA:never}

server:
  port: ${SERVER_PORT:8081}

# ── JWT Authentication (Resource Server) ─────────────────────────────
jwt:
  secret: ${JWT_SECRET:fldc_annapurna_yojana_dev_jwt_secret_key_minimum_32_bytes_long!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ── CORS Configuration ───────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# ── Multi-Tenant Zone Database Configuration ─────────────────────────
zone:
  database:
    active-zones: ${ZONE_DB_ACTIVE_ZONES:2}
    default-zone: ${ZONE_DB_DEFAULT:zone1}
    zone1:
      district-codes: ${ZONE1_DISTRICT_CODES:306,304,664,305,307,308,309,310,311,312,313,314}
    zone2:
      district-codes: ${ZONE2_DISTRICT_CODES:303,703,702,315,316,317,318,319,320,704,306,321}

db:
  zone1:
    read:
      host: ${DB_ZONE1_HOST:localhost}
      port: ${DB_ZONE1_PORT:5432}
      database: ${DB_ZONE1_DATABASE:annapurna_consolidated}
      username: ${DB_ZONE1_USERNAME:postgres}
      password: ${DB_ZONE1_PASSWORD:postgres}
    write:
      host: ${DB_ZONE1_HOST:localhost}
      port: ${DB_ZONE1_PORT:5432}
      database: ${DB_ZONE1_DATABASE:annapurna_consolidated}
      username: ${DB_ZONE1_USERNAME:postgres}
      password: ${DB_ZONE1_PASSWORD:postgres}
  zone2:
    read:
      host: ${DB_ZONE2_HOST:localhost}
      port: ${DB_ZONE2_PORT:5432}
      database: ${DB_ZONE2_DATABASE:annapurna_consolidated}
      username: ${DB_ZONE2_USERNAME:postgres}
      password: ${DB_ZONE2_PASSWORD:postgres}
    write:
      host: ${DB_ZONE2_HOST:localhost}
      port: ${DB_ZONE2_PORT:5432}
      database: ${DB_ZONE2_DATABASE:annapurna_consolidated}
      username: ${DB_ZONE2_USERNAME:postgres}
      password: ${DB_ZONE2_PASSWORD:postgres}
  auth:
    read:
      host: ${DB_AUTH_READ_HOST:localhost}
      port: ${DB_AUTH_READ_PORT:5432}
      database: ${DB_AUTH_DATABASE:annapurna_consolidated}
      username: ${DB_AUTH_READ_USERNAME:postgres}
      password: ${DB_AUTH_READ_PASSWORD:postgres}
    write:
      host: ${DB_AUTH_WRITE_HOST:localhost}
      port: ${DB_AUTH_WRITE_PORT:5432}
      database: ${DB_AUTH_WRITE_DATABASE:annapurna_consolidated}
      username: ${DB_AUTH_WRITE_USERNAME:postgres}
      password: ${DB_AUTH_WRITE_PASSWORD:postgres}

fldc:
  features:
    lot-member-update-enabled: false

# ── OpenAPI / Swagger ────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ── Logging Configuration ────────────────────────────────────────────
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.nic.fldc: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"

