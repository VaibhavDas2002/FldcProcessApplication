spring.application.name=FldcProcessApplication
server.port=8081
# ===================================================================
# Zone Database Configuration
# ===================================================================
zone.database.active-zones=${ZONE_DB_ACTIVE_ZONES:2}
zone.database.default-zone=${ZONE_DB_DEFAULT:zone1}

# District code lists (comma-separated) per zone
zone.database.zone1.district-codes=${ZONE1_DISTRICT_CODES:306,304,664,305,307,308,309,310,311,312,313,314}
zone.database.zone2.district-codes=${ZONE2_DISTRICT_CODES:303,703,702,315,316,317,318,319,320,704,306,321}
# zone.database.zone3.district-codes=${ZONE3_DISTRICT_CODES:17,18,19,20,21,22,23}

# -------------------------------------------------------------------
# Zone 1 - Database Servers
# -------------------------------------------------------------------
db.zone1.read.host=${DB_ZONE1_READ_HOST:10.173.48.130}
db.zone1.read.port=${DB_ZONE1_PORT:5432}
db.zone1.read.database=${DB_ZONE1_DATABASE:annapurna_z1}
db.zone1.read.username=${DB_ZONE1_USERNAME:postgres}
db.zone1.read.password=${DB_ZONE1_PASSWORD:postgres}

db.zone1.write.host=${DB_ZONE1_WRITE_HOST:10.173.48.130}
db.zone1.write.port=${DB_ZONE1_PORT:5432}
db.zone1.write.database=${DB_ZONE1_DATABASE:annapurna_z1}
db.zone1.write.username=${DB_ZONE1_USERNAME:postgres}
db.zone1.write.password=${DB_ZONE1_PASSWORD:postgres}

# -------------------------------------------------------------------
# Zone 2 - Database Servers
# -------------------------------------------------------------------
db.zone2.read.host=${DB_ZONE2_READ_HOST:10.173.48.130}
db.zone2.read.port=${DB_ZONE2_PORT:5432}
db.zone2.read.database=${DB_ZONE2_DATABASE:annapurna_z2}
db.zone2.read.username=${DB_ZONE2_USERNAME:postgres}
db.zone2.read.password=${DB_ZONE2_PASSWORD:postgres}

db.zone2.write.host=${DB_ZONE2_WRITE_HOST:10.173.48.130}
db.zone2.write.port=${DB_ZONE2_PORT:5432}
db.zone2.write.database=${DB_ZONE2_DATABASE:annapurna_z2}
db.zone2.write.username=${DB_ZONE2_USERNAME:postgres}
db.zone2.write.password=${DB_ZONE2_PASSWORD:postgres}

# -------------------------------------------------------------------
# Auth / Consolidate - Database Servers
# -------------------------------------------------------------------
db.auth.read.host=${DB_AUTH_READ_HOST:10.173.48.130}
db.auth.read.port=${DB_AUTH_READ_PORT:5432}
db.auth.read.database=${DB_AUTH_DATABASE:annapurna_consolidate}
db.auth.read.username=${DB_AUTH_READ_USERNAME:postgres}
db.auth.read.password=${DB_AUTH_READ_PASSWORD:postgres}

db.auth.write.host=${DB_AUTH_WRITE_HOST:10.173.48.130}
db.auth.write.port=${DB_AUTH_WRITE_PORT:5432}
db.auth.write.database=${DB_AUTH_DATABASE:annapurna_consolidate}
db.auth.write.username=${DB_AUTH_WRITE_USERNAME:postgres}
db.auth.write.password=${DB_AUTH_WRITE_PASSWORD:postgres}

# -------------------------------------------------------------------
# Default Primary Datasource (Points to Zone 1 Read)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${db.zone1.read.host}:${db.zone1.read.port}/${db.zone1.read.database}
spring.datasource.username=${db.zone1.read.username}
spring.datasource.password=${db.zone1.read.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.session.jdbc.initialize-schema=always
